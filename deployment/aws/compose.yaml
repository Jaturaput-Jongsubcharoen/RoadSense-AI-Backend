services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    networks:
      - model
    volumes:
      - ollama-data:/root/.ollama
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env.aws
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      MODEL_PATH: /app/models/efficientnet_best_model.keras
      OLLAMA_URL: http://ollama:11434/api/generate
      OLLAMA_MODEL: llama3.1
      HF_HOME: /home/roadsense/.cache/huggingface
      FLASK_DEBUG: "false"
    volumes:
      - ../../models:/app/models:ro
      - ../../uploads:/app/uploads
      - ../../runtime/huggingface:/home/roadsense/.cache/huggingface
    networks:
      - proxy
      - model
    expose:
      - "5000"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env.aws}
    networks:
      - proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ollama-data:
  caddy-data:
  caddy-config:

networks:
  proxy:
  model:
