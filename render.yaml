services:
  - type: web
    name: roadsense-ai-backend
    runtime: python
    buildCommand: >-
      pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements-render.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: MODEL_DOWNLOAD_URL
        sync: false
      - key: MODEL_SHA256
        sync: false
      - key: OLLAMA_URL
        sync: false
      - key: OLLAMA_MODEL
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false